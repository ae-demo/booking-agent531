openapi: 3.0.3
info:
  title: Booking API
  version: 0.1.0
  description: Services, staff availability, time off, and bookings for the business.
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            services:read: Browse active services
            services:manage: Create, update and deactivate services
            availability:read: See a staff member's availability and time off
            availability:manage: Set working hours and time off
            slots:read: Compute open slots for a service
            bookings:read: The caller's own bookings
            bookings:read-all: Every booking
            bookings:create: Book an available slot
            bookings:cancel: Cancel or reschedule the caller's own booking
            bookings:manage: Cancel or reschedule any booking
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
    Service:
      type: object
      required: [id, name, durationMinutes, active]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        durationMinutes: { type: integer }
        active: { type: boolean }
    ServiceInput:
      type: object
      required: [name, durationMinutes]
      properties:
        name: { type: string }
        description: { type: string }
        durationMinutes: { type: integer }
        active: { type: boolean, default: true }
    AvailabilityRule:
      type: object
      required: [id, staffId, dayOfWeek, startTime, endTime]
      properties:
        id: { type: string }
        staffId: { type: string }
        dayOfWeek: { type: integer, minimum: 0, maximum: 6, description: 0=Sunday..6=Saturday }
        startTime: { type: string, description: "HH:MM, staff local time" }
        endTime: { type: string, description: "HH:MM, staff local time" }
    AvailabilityRuleInput:
      type: object
      required: [dayOfWeek, startTime, endTime]
      properties:
        dayOfWeek: { type: integer, minimum: 0, maximum: 6 }
        startTime: { type: string }
        endTime: { type: string }
    TimeOff:
      type: object
      required: [id, staffId, startsAt, endsAt]
      properties:
        id: { type: string }
        staffId: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reason: { type: string }
    TimeOffInput:
      type: object
      required: [startsAt, endsAt]
      properties:
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        reason: { type: string }
    Slot:
      type: object
      required: [staffId, startsAt, endsAt]
      properties:
        staffId: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    Booking:
      type: object
      required: [id, customerId, serviceId, staffId, startsAt, endsAt, status, createdAt]
      properties:
        id: { type: string }
        customerId: { type: string }
        serviceId: { type: string }
        staffId: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        status: { type: string, enum: [confirmed, cancelled] }
        createdAt: { type: string, format: date-time }
    BookingInput:
      type: object
      required: [serviceId, staffId, startsAt]
      properties:
        serviceId: { type: string }
        staffId: { type: string }
        startsAt: { type: string, format: date-time }
    BookingRescheduleInput:
      type: object
      required: [startsAt]
      properties:
        startsAt: { type: string, format: date-time }
security:
  - oauth2: []
paths:
  /services:
    get:
      operationId: listServices
      summary: Active services offered by the business
      security:
        - oauth2: [services:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of services
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Service' } }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createService
      summary: Define a new service
      security:
        - oauth2: [services:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInput' }
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        '400':
          description: Invalid service data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: Missing services:manage scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /services/{serviceId}:
    parameters:
      - name: serviceId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateService
      summary: Update or deactivate a service
      security:
        - oauth2: [services:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceInput' }
      responses:
        '200':
          description: Service updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
        '404':
          description: Service not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /services/{serviceId}/slots:
    parameters:
      - name: serviceId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listOpenSlots
      summary: Open time slots for a service, across all staff
      security:
        - oauth2: [slots:read]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Open slots respecting availability, time off and existing bookings
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Slot' } }
        '404':
          description: Service not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /availability-rules:
    get:
      operationId: listAvailabilityRules
      summary: The caller's weekly working-hours rules
      security:
        - oauth2: [availability:read]
      responses:
        '200':
          description: The staff member's availability rules
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/AvailabilityRule' } }
    post:
      operationId: createAvailabilityRule
      summary: Add a weekly working-hours rule
      security:
        - oauth2: [availability:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvailabilityRuleInput' }
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AvailabilityRule' }
        '400':
          description: Invalid rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /availability-rules/{ruleId}:
    parameters:
      - name: ruleId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteAvailabilityRule
      summary: Remove a working-hours rule
      security:
        - oauth2: [availability:manage]
      responses:
        '204':
          description: Rule removed
        '404':
          description: Rule not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /time-off:
    get:
      operationId: listTimeOff
      summary: The caller's blocked-out time
      security:
        - oauth2: [availability:read]
      responses:
        '200':
          description: Time off entries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/TimeOff' } }
    post:
      operationId: createTimeOff
      summary: Block out time (holiday, break)
      security:
        - oauth2: [availability:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimeOffInput' }
      responses:
        '201':
          description: Time off created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeOff' }
        '400':
          description: Invalid time off
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /time-off/{timeOffId}:
    parameters:
      - name: timeOffId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: deleteTimeOff
      summary: Remove a blocked-out period
      security:
        - oauth2: [availability:manage]
      responses:
        '204':
          description: Time off removed
        '404':
          description: Time off not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/bookings:
    get:
      operationId: listMyBookings
      summary: The caller's own bookings, upcoming and past
      security:
        - oauth2: [bookings:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of the caller's bookings
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Booking' } }
    post:
      operationId: createBooking
      summary: Book an available slot
      security:
        - oauth2: [bookings:create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingInput' }
      responses:
        '201':
          description: Booking confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400':
          description: Slot no longer available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/bookings/{bookingId}:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: rescheduleMyBooking
      summary: Reschedule the caller's own booking
      security:
        - oauth2: [bookings:cancel]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingRescheduleInput' }
      responses:
        '200':
          description: Booking rescheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '404':
          description: Booking not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: cancelMyBooking
      summary: Cancel the caller's own booking
      security:
        - oauth2: [bookings:cancel]
      responses:
        '204':
          description: Booking cancelled
        '404':
          description: Booking not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /bookings:
    get:
      operationId: listBookings
      summary: Every booking, for the staff calendar
      security:
        - oauth2: [bookings:read-all]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: A page of every booking
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer }
                  next: { type: string, nullable: true }
                  previous: { type: string, nullable: true }
                  data: { type: array, items: { $ref: '#/components/schemas/Booking' } }
  /bookings/{bookingId}:
    parameters:
      - name: bookingId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: rescheduleBooking
      summary: Reschedule any booking, on the customer's behalf
      security:
        - oauth2: [bookings:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingRescheduleInput' }
      responses:
        '200':
          description: Booking rescheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '404':
          description: Booking not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: cancelBooking
      summary: Cancel any booking, on the customer's behalf
      security:
        - oauth2: [bookings:manage]
      responses:
        '204':
          description: Booking cancelled
        '404':
          description: Booking not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
